# JMeter User Properties Configuration
# Place in: <JMeter Home>/bin/user.properties or use with -q flag

# =====================================================================
# SERVER CONFIGURATION
# =====================================================================

# Target application host and port
TARGET_HOST=localhost
TARGET_PORT=3000
TARGET_PROTOCOL=http

# Server URL (full URL for reference)
SERVER_URL=${TARGET_PROTOCOL}://${TARGET_HOST}:${TARGET_PORT}

# =====================================================================
# LOAD CONFIGURATION
# =====================================================================

# Number of concurrent users (threads)
NUM_THREADS=300

# Time to ramp up to full user load (seconds)
RAMP_UP_TIME=300

# Total test duration (seconds)
DURATION=600

# Number of times each user repeats the test
LOOPS=1

# =====================================================================
# USER DATA
# =====================================================================

# Test user credentials (existing user for login tests)
TEST_EMAIL=test@example.com
TEST_PASSWORD=SecurePass123!

# Admin credentials
ADMIN_EMAIL=admin@example.com
ADMIN_PASSWORD=AdminPass123!

# Base domain for generated email addresses
BASE_DOMAIN=example.com

# =====================================================================
# THINK TIME / PACING
# =====================================================================

# Minimum think time between actions (milliseconds)
MIN_THINK_TIME=1000

# Maximum think time between actions (milliseconds)
MAX_THINK_TIME=5000

# Time between transaction iterations (seconds)
ITERATION_DELAY=2

# =====================================================================
# CONNECTION SETTINGS
# =====================================================================

# Connection timeout (milliseconds)
CONNECT_TIMEOUT=5000

# Response timeout (milliseconds)
RESPONSE_TIMEOUT=30000

# Maximum redirects to follow
MAX_REDIRECTS=5

# Follow redirects automatically
FOLLOW_REDIRECTS=true

# =====================================================================
# TEST DATA
# =====================================================================

# Product IDs for testing
PRODUCT_ID_1=1
PRODUCT_ID_2=2
PRODUCT_ID_3=3

# Test product data
TEST_PRODUCT_NAME=Test Product
TEST_PRODUCT_PRICE=99.99

# Cart test data
TEST_QUANTITY=1

# =====================================================================
# REPORTING
# =====================================================================

# Sample every N requests for results (1 = all, 10 = 10%)
SAMPLE_RATE=1

# Save response data (affects memory usage)
SAVE_RESPONSE_DATA=false

# Save sampler data labels
SAVE_LABELS=true

# Save fields from data
SAVE_SUCCEEDED=true
SAVE_FAILED=true

# =====================================================================
# JVM SETTINGS (set JVM_ARGS environment variable)
# =====================================================================

# For 4GB heap allocation:
# set JVM_ARGS=-Xmx4g -Xms2g

# For 8GB heap allocation:
# set JVM_ARGS=-Xmx8g -Xms4g

# Performance tuning:
# -XX:+UseG1GC = Better garbage collection
# -XX:MaxGCPauseMillis=200 = Limit GC pauses
# -XX:+ParallelRefProcEnabled = Parallel reference processing

# =====================================================================
# LOGGING
# =====================================================================

# Log level (FATAL, ERROR, WARN, INFO, DEBUG, TRACE)
log_level.jmeter=INFO

# Disable standard output logging (faster)
log_level.jmeter.threads=ERROR

# Remote sampler logging
log_level.jmeter.engine.RemoteJMeterEngineImpl=INFO

# =====================================================================
# PERFORMANCE TUNING
# =====================================================================

# Disable assertions in production load tests (faster)
DISABLE_ASSERTIONS=false

# Performance tuning options
TESTRUNS=1
SUMMARISER_NAME=summary
SUMMARISER_INTERVAL=30

# Use less GUI features during non-GUI execution
HEADLESS_MODE=true

# =====================================================================
# PROXY SETTINGS (if needed)
# =====================================================================

# http.proxyHost=proxy.example.com
# http.proxyPort=8080
# https.proxyHost=proxy.example.com
# https.proxyPort=8080
# http.non-proxyHosts=localhost

# =====================================================================
# SSL/TLS SETTINGS
# =====================================================================

# Ignore SSL errors (for testing self-signed certs)
# javax.net.debug=all
# https.protocols=TLSv1.2

# =====================================================================
# CSS SELECTOR & XPATH SETTINGS
# =====================================================================

# CSS Selector for response parsing
CSS_SELECTOR_STYLE=div.content

# XPATH for response parsing
XPATH_EXPRESSION=//*[@id='main']

# =====================================================================
# DISTRIBUTED TESTING (Master/Slave)
# =====================================================================

# For running tests across multiple machines
# remote_hosts=192.168.1.10:1099,192.168.1.11:1099
# client.rmi.localport=7199
# mode=Statistical
